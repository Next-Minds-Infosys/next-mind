services:
  postgres:
    image: postgres:16-alpine
    container_name: next-mind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: next_mind
      POSTGRES_PASSWORD: next_mind
      POSTGRES_DB: next_mind
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_mind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
